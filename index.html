<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيرفر ماينكرافت - التحقق والدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #212121;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(46, 204, 113, 0.15) 0%, transparent 60%),
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(33, 33, 33, 0.9);
            border: 2px solid rgba(46, 204, 113, 0.3);
            border-radius: 20px;
            padding: 40px 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 20px rgba(46, 204, 113, 0.15);
            text-align: center;
            backdrop-filter: blur(10px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        /* أنيميشن الاختفاء والظهور */
        .fade-out {
            opacity: 0 !important;
            transform: scale(0.9) translateY(-20px) !important;
            pointer-events: none;
        }

        .fade-in {
            animation: mainAppear 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes mainAppear {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .server-icon {
            width: 85px;
            height: 85px;
            background: #2ecc71;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #121212;
            box-shadow: 0 0 25px rgba(46, 204, 113, 0.4);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(46, 204, 113, 0.3); }
            100% { box-shadow: 0 0 30px rgba(46, 204, 113, 0.6); }
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p.description {
            font-size: 15px;
            color: #b0b0b0;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* حقول واجهة رمز الدخول */
        .passcode-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .passcode-input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid rgba(46, 204, 113, 0.4);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 18px;
            text-align: center;
            outline: none;
            letter-spacing: 2px;
            transition: border-color 0.3s;
        }

        .passcode-input:focus {
            border-color: #2ecc71;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            display: none;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* الأزرار */
        .buttons-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-submit {
            background-color: #2ecc71;
            color: #121212;
        }

        .btn-submit:hover {
            background-color: #27ae60;
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: #ffffff;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            background-color: #1eb956;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.5);
        }

        .btn-minecraft {
            background-color: #2ecc71;
            color: #121212;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3);
        }

        .btn-minecraft:hover {
            background-color: #27ae60;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.5);
        }

        /* إخفاء المحتوى الرئيسي في البداية */
        #mainContent {
            display: none;
            opacity: 0;
        }

        footer {
            margin-top: 25px;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة إدخال الرمز الخاص بأصحابك -->
    <div class="container" id="authBox">
        <div class="server-icon">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h1>منطقة الأعضاء الخاصة</h1>
        <p class="description">يرجى إدخال رمز الدخول للوصول لروابط السيرفر وقروب الواتساب.</p>

        <div class="passcode-box">
            <input type="password" id="passInput" class="passcode-input" placeholder="أدخل الرمز..." autocomplete="off">
            <p class="error-message" id="errorText">الرمز غير صحيح! حاول مرة أخرى.</p>
            <button onclick="checkPassword()" class="btn btn-submit">تأكيد الدخول</button>
        </div>
    </div>

    <!-- 2. واجهة السيرفر الأنيقة (تظهر بالأنيميشن) -->
    <div class="container" id="mainContent">
        <div class="server-icon">
            <i class="fa-solid fa-cube"></i>
        </div>

        <h1>اسم السيرفر هنا</h1>
        
        <p class="description">
            أهلاً بك يا بطل! انضم معنا في قروب الواتساب للتنسيق وحمّل ملف ماينكرافت لتنطلق معنا.
        </p>

        <div class="buttons-wrapper">
            <!-- ضع رابط الواتساب الخاص بك مكان # -->
            <a href="https://chat.whatsapp.com/YOUR_LINK_HERE" target="_blank" class="btn btn-whatsapp">
                <i class="fa-brands fa-whatsapp" style="font-size: 24px;"></i>
                دخول لقروب الواتساب
            </a>

            <!-- ضع اسم ملف ماينكرافت الخاص بك مكان minecraft_file.zip -->
<a href="https://drive.google.com/file/d/1dXBFChYTbyhgNGgmEHhamGl_UrbAVfbr/view?usp=drivesdk" target="_blank" class="btn btn-minecraft">
    <i class="fa-solid fa-download"></i>
    تحميل ماين كرافت
</a>

        </div>
    </div>

    <footer>جميع الحقوق محفوظة &copy; سيرفر ماينكرافت</footer>

    <script>
        // الرمز السري لخويانك (تقدر تغيره لأي رمز تبي)
        const SECRET_CODE = "826567";

        function checkPassword() {
            const inputVal = document.getElementById("passInput").value;
            const errorText = document.getElementById("errorText");
            const authBox = document.getElementById("authBox");
            const mainContent = document.getElementById("mainContent");

            if (inputVal === SECRET_CODE) {
                // تشغيل أنيميشن الاختفاء لشاشة الرمز
                authBox.classList.add("fade-out");

                setTimeout(() => {
                    authBox.style.display = "none";
                    mainContent.style.display = "block";
                    // تشغيل أنيميشن الظهور الفاخر لصفحة الأزرار
                    mainContent.classList.add("fade-in");
                }, 400); // ينتظر انتهاء أنيميشن الاختفاء
            } else {
                errorText.style.display = "block";
                document.getElementById("passInput").value = "";
            }
        }

        // إمكانية الضغط على Enter من لوحة المفاتيح
        document.getElementById("passInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>
</body>
</html>
